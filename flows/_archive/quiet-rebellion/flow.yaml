# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: quiet-rebellion
brief_default: |
  Build a one-page site for "Adopt an Acre" — a quiet-rebellion fundraiser to protect Pacific Northwest scrubland from clearcut.

  The page features THREE looping hero videos in sequence (a 3-shot arc: weathered hands on a sapling → wide lone figure in a cleared field with bulldozer tracks → first leaf catching wind at dawn) and a prominent "Adopt an Acre" button linking to https://example.com/donate.

# rationale: showcase — agent fetches Fal-generated media via curl from the
# sandbox. The Vercel deploy is performed OUT-OF-SESSION by the host
# post_session_hook below, so the token never enters the agent transcript or
# sandbox (per NIST SP 800-204C build/deploy separation, OWASP Secrets
# Management Cheat Sheet, and CVE-2026-44479).
environment:
  networking:
    type: unrestricted

vaults:
  - display_name: fal
    credential:
      display_name: Fal MCP
      mcp_server_url: https://mcp.fal.ai/mcp
      token_env: FAL_API_KEY

agents:
  - key: videographer
    file: agents/videographer.yaml
    mcp_servers:
      - type: url
        url: https://mcp.fal.ai/mcp
        name: fal
    tools:
      - type: agent_toolset_20260401
        default_config: { enabled: true }
      - type: mcp_toolset
        mcp_server_name: fal
        default_config:
          enabled: true
          # rationale: showcase — Fal MCP returns URLs only. Production posture
          # should graduate to always_ask. Slice 45 follow-up.
          permission_policy: { type: always_allow }
  - key: web_builder
    file: agents/web-builder.yaml
  - key: director
    file: agents/director.yaml
    is_director: true
    coordinator: [videographer, web_builder]

run:
  attach_vault: true
  stall_ms: 240000
  max_restarts: 1
  outcome:
    description: "Manifest at /mnt/session/outputs/manifest.json with 3 reachable video_urls, ready_to_deploy:true, and site_dir pointing at a folder containing index.html with 3 video elements and an 'Adopt an Acre' button."
    rubric_file: rubric.md
    max_iterations: 1
  # Slice 10 §1.F2 — host-side deploy. Token via env (never CLI arg) per
  # CVE-2026-44479. Authority: NIST SP 800-204C, OWASP Secrets Management.
  post_session_hook:
    command: bun run "$BRAID_FLOW_DIR/../../.claude/skills/braid/post-hooks/vercel-deploy.ts"
    env_passthrough: [VERCEL_TOKEN]
    timeout_ms: 300000
