# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: ad-render
env_name: braid-ad-render
state_file: state.json
output_dir: outputs/ad-render
brief_default: |
  https://www.adidas.com/us/adizero-adios-pro-evo-3-shoes/KH7678.html

# rationale: user supplies an arbitrary product URL, so scout must reach any
# host on the public web. The director rejects briefs that don't contain a
# valid http(s) URL.
environment:
  networking:
    type: unrestricted

memory_stores:
  - key: scoutStore
    name: ad-render-scout
    access: read_write
    instructions: |
      Product facts per URL. Namespace under /products/<slug>/.
      Files: facts.json, images.json, logo.json, fonts.json.
  - key: stylistStore
    name: ad-render-stylist
    access: read_write
    instructions: |
      Brand tokens per product. /products/<slug>/{brand-summary.md, colors.css, typography.css, aesthetic.md}.
  - key: copyStore
    name: ad-render-copy
    access: read_write
    instructions: |
      Ad copy per product. /products/<slug>/{headlines.md, primary-copy.md, ctas.md}.
  - key: designerStore
    name: ad-render-designer
    access: read_write
    instructions: |
      Static ad HTML per product. /products/<slug>/static-ad-{1,2,3}.html.

agents:
  - key: scout
    file: agents/scout.yaml
  - key: stylist
    file: agents/stylist.yaml
  - key: copywriter
    file: agents/copywriter.yaml
  - key: designer
    file: agents/designer.yaml
  - key: director
    file: agents/director.yaml
    is_director: true
    coordinator: [scout, stylist, copywriter, designer]

run:
  attach_stores: true
  stall_ms: 240000
  max_restarts: 1
  log_runs: true
  outcome:
    description: |
      Either (a) no URL → director replied "no URL provided — nothing to do" and outputs is empty;
      or (b) outputs contains manifest.json with non-empty product/assets/brand/copy/ads
      sections, plus colors.css, typography.css, headlines.md, primary-copy.md, ctas.md,
      images.json, logo.json, fonts.json, and static-ad-1.html / static-ad-2.html /
      static-ad-3.html — each linking to ./colors.css and ./typography.css and each
      containing a single <img data-role="product-hero" ...> element using
      manifest.product.hero_image_url. The host render hook (post_session_hook) will
      then produce static-ad-1.png, static-ad-2.png, static-ad-3.png, validation.json,
      and update manifest with render results.
    rubric_file: rubric.md
    max_iterations: 1
  # Host-side render + validate. No secrets required; env_passthrough is empty.
  post_session_hook:
    command: bun run "$BRAID_FLOW_DIR/post-hooks/render-and-validate.ts"
    env_passthrough: []
    timeout_ms: 360000
