# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: gauntlet-ads
env_name: braid-gauntlet-ads
state_file: state.json
output_dir: outputs/gauntlet-ads
brief_default: |
  https://gauntletai.com/

# rationale: scout fetches the gauntletai.com URL; designer pre-downloads
# CDN-hosted hero/logo assets with curl so the in-sandbox Chromium can
# render them via page.route() (Chromium can't resolve external HTTPS
# certs inside the sandbox — ERR_CERT_AUTHORITY_INVALID).
environment:
  networking:
    type: unrestricted
  # No packages declared on purpose. Playwright + Chromium ship with the
  # Anthropic base image at /opt/node-tools/node_modules/playwright and
  # /opt/pw-browsers/. ffmpeg / curl / python3 / node22 also pre-installed.

memory_stores:
  - key: scoutStore
    name: gauntlet-ads-scout
    access: read_write
    instructions: |
      Product facts per URL, namespaced under /products/<slug>/.
      Files: facts.json, images.json, logo.json, fonts.json.
  - key: designerStore
    name: gauntlet-ads-designer
    access: read_write
    instructions: |
      Brand tokens + ad HTML + validation per product, /products/<slug>/.

agents:
  - key: scout
    file: agents/scout.yaml
  - key: designer
    file: agents/designer.yaml
  - key: director
    file: agents/director.yaml
    is_director: true
    coordinator: [scout, designer]

run:
  attach_stores: true
  stall_ms: 360000
  max_restarts: 1
  log_runs: true
  outcome:
    description: |
      /mnt/session/outputs/ contains:
        - manifest.json with product, hero_image_url, and 5 ads
        - colors.css, typography.css
        - ad-1.html + ad-1.png (1080×1080 square)
        - ad-2.html + ad-2.png (1080×1350 portrait)
        - ad-3.html + ad-3.png (1080×1920 story)
        - ad-4.html + ad-4.png (1200×628 landscape)
        - ad-5.html + ad-5.png (1080×566 wide)
        - validation.json with pass:5 fail:0 broken_images:[]
    rubric_file: rubric.md
    max_iterations: 2
