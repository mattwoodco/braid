# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: fundraiser
brief_default: |
  Build a one-page fundraiser site for "Save the Community Centre" — a charming fundraiser to renovate a dated community hall used for film nights, bingo, and senior socials.

  The page features a short looping hero video (warm, nostalgic, documentary feel — elderly folks gathered around a film projector in the hall) and a prominent "Donate Now" button linking to https://example.com/donate.

  Vercel access token: {{env:VERCEL_TOKEN}}

vaults:
  - display_name: fal
    credential:
      display_name: Fal MCP
      mcp_server_url: https://mcp.fal.ai/mcp
      token_env: FAL_API_KEY

agents:
  - key: videographer
    file: agents/videographer.yaml
    mcp_servers:
      - type: url
        url: https://mcp.fal.ai/mcp
        name: fal
    tools:
      - type: agent_toolset_20260401
        default_config: { enabled: true }
      - type: mcp_toolset
        mcp_server_name: fal
        default_config:
          enabled: true
          permission_policy: { type: always_allow }
  - key: web_builder
    file: agents/web-builder.yaml
  - key: director
    file: agents/director.yaml
    is_director: true
    coordinator: [videographer, web_builder]

run:
  attach_vault: true
  stall_ms: 240000
  max_restarts: 1
  outcome:
    description: "Manifest at /mnt/session/outputs/manifest.json with reachable video_url and reachable page_url that contains a video element and a 'Donate Now' button."
    rubric_file: rubric.md
    max_iterations: 1
