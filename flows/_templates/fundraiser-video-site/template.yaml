name: fundraiser-video-site
description: |
  One-page fundraiser landing site featuring N looping hero videos generated
  by Fal MCP plus a prominent CTA button. Director coordinates videographer
  and web-builder; deploy runs out-of-session via the Vercel post-session
  hook (token never enters the agent transcript).

  Use when: you have a cause, a visual style, and either 1 or 3 shot ideas,
  and want a deployable landing page with a working donate/support button.

parameters:
  - { key: flow_name,      type: string, required: true,  pattern: "^[a-z][a-z0-9-]*$", description: "kebab-case folder name under flows/" }
  - { key: cause_title,    type: string, required: true,  description: "Headline cause name, e.g. \"Save the Community Centre\"" }
  - { key: subtitle,       type: string, required: true,  description: "One-sentence subtitle under the headline" }
  - { key: brief,          type: string, required: true,  multiline: true, description: "Default brief shown to director on run" }
  - { key: shot_count,     type: int,    required: true,  enum: [1, 3], description: "1 = single hero loop; 3 = HOOK/ESCALATION/PAYOFF arc" }
  - { key: visual_bible,   type: string, required: true,  multiline: true, description: "Locked visual style — restated verbatim in every Fal prompt" }
  - { key: shots,          type: "string[]", required: true, description: "Per-shot framing/action descriptions; length MUST match shot_count" }
  - { key: cta_text,       type: string, required: true,  description: "Literal button text, e.g. \"Donate Now\"" }
  - { key: cta_href,       type: string, default: "https://example.com/donate" }
  - { key: palette_hint,   type: string, default: "warm honey/cream with deep burgundy accents" }
  - { key: vercel_project, type: string, default: "{{flow_name}}-site" }

defaults:
  agents:
    director:     { tier: orchestrate }
    videographer: { tier: reason }
    web_builder:  { tier: execute }
