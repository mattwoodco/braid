# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: snapshots
brief_default: |
  Three photos: a single cup of coffee on a wooden table near a sunny window.
  Vary the angle and mood across the three shots.

# rationale: showcase — downloads Fal-generated media via curl from the sandbox.
# Slice 20 follow-up: scope to Fal CDN host(s).
environment:
  networking:
    type: unrestricted

vaults:
  - display_name: fal
    credential:
      display_name: Fal MCP
      mcp_server_url: https://mcp.fal.ai/mcp
      token_env: FAL_API_KEY

memory_stores:
  - key: styleStore
    name: snapshots-style
    access: read_write
    instructions: |
      Style notes for the snapshots flow. Read style.md before composing prompts.
    seed:
      mount: /mnt/memory/style
      files: [seeds/style.md]
    dream_instructions: |
      Review session prompts and outcomes. Update /mnt/memory/style/style.md with
      patterns that produced grader-passing shots. Remove guidance that led to
      retries or failures. Keep the file under 40 lines.
  # Slice 100 — pattern memory for per-run reflection.
  - key: lessonsStore
    name: snapshots-lessons
    access: read_write
    instructions: |
      Reusable patterns extracted by the reflector after each run.
      Read this before composing prompts; the reflector appends after.

agents:
  - key: photographer
    file: agents/photographer.yaml
    is_director: true
    mcp_servers:
      - { type: url, url: https://mcp.fal.ai/mcp, name: fal }
    tools:
      - type: agent_toolset_20260401
        default_config: { enabled: true }
      - type: mcp_toolset
        mcp_server_name: fal
        default_config:
          enabled: true
          # rationale: showcase — Fal MCP returns URLs only. Production posture
          # should graduate to always_ask. Slice 45 follow-up.
          permission_policy: { type: always_allow }
  # Slice 100 — reflector agent for automatic per-run pattern extraction.
  - key: reflector
    file: agents/reflector.yaml

run:
  attach_vault: true
  log_runs: true
  stall_ms: 180000
  max_restarts: 0
  outcome:
    description: "Three images and a manifest.json exist in /mnt/session/outputs/."
    rubric_file: rubric.md
    max_iterations: 1
  # Slice 100 — automatic per-run reflection. After a successful run, the
  # reflector reads the trajectory + outcome and writes reusable patterns to
  # lessonsStore. Future runs of `snapshots` can attach lessonsStore as
  # read-only context. Authority: Slice 100 architectural decision 4dce6f31.
  reflection:
    agent_key: reflector
    target_store: lessonsStore
