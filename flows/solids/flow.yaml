# yaml-language-server: $schema=../../.claude/skills/braid/flow.schema.json
name: solids
brief_default: |
  Build a single-page Three.js shape carousel inspired by the reference design files.
  You DO NOT deploy. The host runs the Vercel deploy after this session ends, using
  the manifest you write. Each run must pick a NEW title that is NOT "Solids · Vol. 01".

  The title MUST be a natural-language time-of-day phrase derived from the current UTC time.
  Examples: "First Light", "Blue Hour", "Late Afternoon", "Midnight Oil", "Dawn Chorus",
  "Witching Hour", "Golden Hour", "Cobalt Dusk", "Slow Morning". Pick one that fits the
  actual current time, and use it in BOTH the <title> tag and the brand text in the header.

  Reference design files (read all four before building):
    Solo carousel : {{file:design/SoloCarousel.html}}
    Pair view     : {{file:design/Pair.html}}
    Stack view    : {{file:design/Stack.html}}

  Build ONE polished HTML file that takes the Solo carousel as the base layout and folds
  in the typographic + material direction from Pair/Stack. Use the same color tokens,
  Fraunces + JetBrains Mono fonts, film-grain overlay, ACES tone mapping, and physical
  materials (pearl, gold, jade, glass, copper, obsidian). It must include 6 platonic /
  topological solids in a Three.js carousel with keyboard, wheel, drag, and dot nav.

  Deliverables (all under /mnt/session/outputs/site/):
    - index.html        the full single-file site (no external project files)
    - README.md         documents the chosen title and design source

  Also write /mnt/session/outputs/manifest.json:
    { "title": "<chosen title>", "site_dir": "site",
      "project_name": "solids-<slug>", "ready_to_deploy": true }

  Do NOT install or run the Vercel CLI. Do NOT accept any deploy token from this brief.

# rationale: showcase — agent reads local file references via {{file:...}} and
# builds against unpkg-hosted Three.js. The Vercel deploy is performed
# OUT-OF-SESSION by the host post_session_hook below, so the token never
# enters the agent transcript or sandbox (per NIST SP 800-204C build/deploy
# separation, OWASP Secrets Management Cheat Sheet, and CVE-2026-44479).
environment:
  networking:
    type: unrestricted

vault:
  display_name: vercel
  credential:
    display_name: Vercel MCP
    mcp_server_url: https://mcp.vercel.com
    token_env: VERCEL_TOKEN

agents:
  - key: builder
    file: agents/builder.yaml
    is_director: true
    mcp_servers:
      - { type: url, url: https://mcp.vercel.com, name: vercel }
    tools:
      - type: agent_toolset_20260401
        default_config: { enabled: true }
      - type: mcp_toolset
        mcp_server_name: vercel
        default_config:
          enabled: true
          # rationale: showcase — Vercel MCP returns deploy URLs/IDs. Production
          # posture should graduate to always_ask. Slice 45 follow-up.
          permission_policy: { type: always_allow }

run:
  attach_vault: true
  attach_stores: false
  stall_ms: 240000
  max_restarts: 1
  outcome:
    description: "A built Three.js shape carousel at /mnt/session/outputs/site/index.html with a fresh time-of-day title, manifest.json with ready_to_deploy:true."
    rubric_file: rubric.md
    max_iterations: 2
  # Slice 10 §1.F2 — host-side deploy. Token via env (never CLI arg) per
  # CVE-2026-44479. Authority: NIST SP 800-204C, OWASP Secrets Management.
  post_session_hook:
    command: bun run "$BRAID_FLOW_DIR/../../.claude/skills/braid/post-hooks/vercel-deploy.ts"
    env_passthrough: [VERCEL_TOKEN]
    timeout_ms: 300000
